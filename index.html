<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>청력검사 결과 쉽게보기</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 1단계: 드래그앤드롭 화면 -->
  <section id="dropScreen" class="drop-screen">
    <div class="brand">청력검사 결과 <b>쉽게보기</b></div>
    <div id="dropZone" class="dropzone">
      <div class="dz-icon">📄</div>
      <p class="dz-title">여기에 검사 결과 PDF를 끌어다 놓으세요</p>
      <p class="dz-sub">순음청력검사 · 임피던스청력검사 결과지</p>
      <button id="pickBtn" class="dz-btn" type="button">또는 파일 선택</button>
      <input id="fileInput" type="file" accept="application/pdf" hidden />
    </div>
    <p id="dropError" class="drop-error" hidden></p>
  </section>

  <!-- 처리 중 -->
  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <p id="loadingText">결과지를 분석하고 있어요…</p>
  </div>

  <!-- 2단계: 결과(슬라이드) 화면 -->
  <section id="resultScreen" class="result-screen" hidden>
    <button id="backBtn" class="back-fab no-advance" type="button" hidden>← 이전</button>

    <div id="deck">
      <!-- 순음청력검사 -->
      <section class="page" data-page="audio" data-sub="0">
        <div class="audio-grid">
          <article class="panel" data-ear="right">
            <div class="panel-banner banner-right">
              <span class="ear-label">오른쪽</span>
              <span class="ear-en">RIGHT</span>
              <span class="pta-box">
                <span class="signal" id="sigRight"></span>
                <span class="pta-val" id="ptaRight"></span>
              </span>
            </div>
            <div class="chart-wrap" id="chartRight">
              <span class="normal-badge">정상 영역 (25dB 이하)</span>
            </div>
          </article>
          <article class="panel" data-ear="left">
            <div class="panel-banner banner-left">
              <span class="ear-label">왼쪽</span>
              <span class="ear-en">LEFT</span>
              <span class="pta-box">
                <span class="signal" id="sigLeft"></span>
                <span class="pta-val" id="ptaLeft"></span>
              </span>
            </div>
            <div class="chart-wrap" id="chartLeft">
              <span class="normal-badge">정상 영역 (25dB 이하)</span>
            </div>
          </article>
        </div>
        <button id="audioFab" class="audio-fab no-advance" type="button" hidden>🔊 소리 들어보기</button>
        <audio id="player" src="assets/sound.mp3" preload="auto"></audio>
      </section>

      <!-- 임피던스 -->
      <section class="page" data-page="tymp" hidden>
        <div class="tymp-grid">
          <article class="tymp-panel">
            <div class="tymp-head head-right">오른쪽 <span>RIGHT</span></div>
            <div class="tymp-wrap" id="tympRight"></div>
          </article>
          <article class="tymp-panel">
            <div class="tymp-head head-normal">정상 참고 <span>NORMAL</span></div>
            <div class="tymp-wrap" id="tympNormal"></div>
          </article>
          <article class="tymp-panel">
            <div class="tymp-head head-left">왼쪽 <span>LEFT</span></div>
            <div class="tymp-wrap" id="tympLeft"></div>
          </article>
        </div>
      </section>

      <!-- 언어청력 -->
      <section class="page" data-page="speech" hidden>
        <h2 class="page-title">언어청력검사 <span>(말소리 검사 결과)</span></h2>
        <div class="capture-card" id="speechCapture"></div>
      </section>

      <!-- 이명 -->
      <section class="page" data-page="tinnitus" hidden>
        <h2 class="page-title">이명검사 <span>(Tinnitogram)</span></h2>
        <div class="tinnitus-grid" id="tinnitusGrid"></div>
      </section>
    </div>

    <div class="hint" id="hint">화면을 클릭하면 다음 단계로 넘어갑니다</div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
